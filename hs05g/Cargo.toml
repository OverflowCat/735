[package]
name = "hs05g"
version = "0.1.0"
edition = "2024"
description = "HS05G radon monitor hub protocol implementation"

[dependencies]
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0.104"
